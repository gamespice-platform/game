# Every script parses, then every suite runs. The whole check is in gamespice-platform/ci,
# so that fixing it is one commit rather than one per repository; its README says what
# the inputs are and why a release does not touch the content origin.
#
# branches: ['**'] rather than [main] on purpose. Several repositories in this family
# sit on a task branch for days, and a main-only trigger is a check that reports
# nothing about the work anybody is actually doing -- the same assumption that made
# push-github.sh push a stale ref, succeed, and send nothing.
name: CI

on:
    push:
        branches: ['**']
        paths-ignore:
            - '**/*.md'
            - 'screenshots/**'
    pull_request:
    workflow_dispatch:

jobs:
    validate:
        uses: gamespice-platform/ci/.github/workflows/validate.yml@v1.4.0
        with:
            efficiency: true
            hygiene: true
        secrets:
            DEPS_TOKEN: ${{ secrets.GS_DEPS_TOKEN }}

    # The visual judge loop's self-test (tests/visual_judge/selftest.sh): stub judge and stub nightly,
    # no GPU, no Claude account. Every defect fixed in the judge, the gate and the post tool has a case
    # here, so a change that breaks one fails CI rather than a nightly QA pass (vjudge-second-review-1).
    visual-judge-selftest:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - name: Install ffmpeg
              run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
            - name: Visual judge self-test
              run: bash tests/visual_judge/selftest.sh
