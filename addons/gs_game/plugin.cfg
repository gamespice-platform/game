[plugin]

name="gs-game"
description="The wiring every server game repeats: resolving the game object, building the netcode and its bridge, loading identity and services, driving one authoritative tick, keeping the roster, and unloading in reverse. Rules live in gs-match and gs-objective; this is the scaffolding underneath them. Depends on gs-core, gs-server and gs-net."
author="dot"
version="0.1.0"
script="gs_game_plugin.gd"
